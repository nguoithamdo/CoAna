# Continuous integration for the oligomer-analysis package.
#
# Two axes matter for this project:
#   * OS: Linux (HPC clusters) and Windows (desktop machines)
#   * extras: with and without MDAnalysis, because CoAnaPure must be fully
#     functional without it while the cross-validation tests only run with it.

name: tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: py${{ matrix.python-version }} / ${{ matrix.os }} / ${{ matrix.extras }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        extras: [core, mdanalysis]
        exclude:
          # One MDAnalysis leg per OS is enough; run it on the newest Python.
          - python-version: "3.10"
            extras: mdanalysis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install MDAnalysis extra
        if: matrix.extras == 'mdanalysis'
        run: pip install -e ".[mdanalysis]"

      - name: Run test suite
        env:
          PYTHONIOENCODING: utf-8
          MPLBACKEND: Agg
        run: python -m pytest tests -q

      - name: CLI smoke test
        env:
          MPLBACKEND: Agg
        run: |
          coana version
          coana --help
